name: Wochenplan erstellen

on:
  workflow_dispatch:
  push:
    paths:
      - 'lagerbestand.json'
      - 'Verkaufszahlen1.xlsx'
      - 'System/planner.py'
      - 'Kalkulation/Preise.xlsx'

permissions:
  contents: write

jobs:
  planung:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install openpyxl

      - name: Wochenplan erstellen
        run: python3 -u System/planner.py

      - name: Ergebnisse committen und pushen
        run: |
          git config user.name "Kuchenplaner"
          git config user.email "planer@kuchenproduktion.local"
          # Wochenplan + Auto-Archivierung + Forecast-Historie
          git add Wochenplan/ System/lager_archiv/ Verkaufshistorie.json
          gi